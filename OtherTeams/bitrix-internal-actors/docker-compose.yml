# Local development infrastructure for bitrix-internal-actors.
# Brings up the durable state (Postgres), active state (Redis), and the
# event broker (Kafka + Zookeeper). Application services run on the host via `make run-*`.

services:
  postgres:
    image: postgres:16
    container_name: bia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitrix}
      POSTGRES_DB: ${POSTGRES_DB:-bitrix_internal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # name the DB explicitly; without -d, pg_isready defaults dbname to the username
      # ("bitrix"), which doesn't exist and logs a FATAL every interval (cosmetic noise).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitrix} -d ${POSTGRES_DB:-bitrix_internal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: bia-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: bia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: bia-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Keep the event log durable for replay
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Internal Messaging System (Internal Chat) — a standalone business-system
  # surface agents talk through (REST + MCP). Full production stack:
  #   durable state -> PostgreSQL   active state -> Redis   events -> Kafka
  internal-messaging:
    build:
      context: .
      dockerfile: services/internal_messaging/Dockerfile
    container_name: bia-internal-messaging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      CHAT_PORT: 8080
      # durable state (PostgreSQL)
      CHAT_STORE: postgres
      CHAT_DB_URL: postgresql://${POSTGRES_USER:-bitrix}:${POSTGRES_PASSWORD:-bitrix}@postgres:5432/${POSTGRES_DB:-bitrix_internal}
      # active state (Redis)
      CHAT_CACHE: redis
      CHAT_REDIS_URL: redis://redis:6379/0
      # events (Kafka)
      CHAT_BUS: kafka
      CHAT_KAFKA_BROKERS: kafka:9092
      CHAT_KAFKA_TOPIC: chat.message_posted
      # NTP_URL: http://time-service:9000/now   # set when the world clock lands
    volumes:
      - chatdata:/data

volumes:
  pgdata:
  chatdata:
