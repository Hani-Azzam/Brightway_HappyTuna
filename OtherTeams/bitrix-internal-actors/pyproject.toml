[project]
name = "bitrix-internal-actors"
version = "0.1.0"
description = "Internal organization simulation (COO, employees, internal chat, staff portal, audit) for the AI-CEO crisis research platform."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- API ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",

    # --- Auth (per-agent identity for chat/portal) ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "email-validator==2.1.1",

    # --- State ---
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",      # PostgreSQL (durable world state)
    "alembic==1.13.3",             # migrations
    "redis==5.1.1",                # active world state

    # --- Event bus (pick one; aiokafka shown, swap for nats-py if using NATS) ---
    "aiokafka==0.11.0",

    # --- LLM / RAG ---
    "anthropic==0.117.0",          # Claude — the agents' LLM (packages.llm.anthropic_client)
    "openai==1.51.0",              # optional: OpenAI/NIM-compatible client (packages.llm.llm_client)
    "tiktoken==0.8.0",

    # --- Agents (employee/COO) runtime ---
    "httpx==0.27.2",               # tool clients call internal_messaging / mail / portal
    "pyyaml==6.0.2",               # persona profile loading

    # --- Vector DB (semantic memory) ---
    "chromadb==0.5.13",            # local default; swap for pinecone-client if preferred
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
    "pre-commit==4.0.1",
]

# --- Monorepo: shared libs + services are local packages ---
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, isort, bugbear, pyupgrade

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
